function bt(){if(!S.bat){S.bat={};for(const k in MEDS){const s=S.stock[k],a=Math.min(5,s);S.bat[k]=[{q:a,ed:day()+2},{q:s-a,ed:day()+150}]}}return S.bat}
const first=k=>bt()[k].filter(x=>x.q>0).sort((a,c)=>a.ed-c.ed)[0];
function takeB(k){const b=first(k);if(b)b.q--}
function edOf(k){const b=first(k);return b?b.ed:'-'}
function addB(k,q,ed){const b=ed?null:first(k);b?b.q+=q:bt()[k].push({q,ed:ed||day()+150})}
function recv(o){S.rcvN=(S.rcvN||0)+1;const n=S.up&&S.up.gud?30:20;S.stock[o.k]+=n;addB(o.k,n,day()+(o.sh||150))}
function expire(){const m=[];for(const k in MEDS){bt()[k]=bt()[k].filter(b=>{if(b.ed<day()&&b.q>0){S.stock[k]-=b.q;S.ret.push({k,q:b.q});m.push(nm(k));return false}return b.q>0||b.ed>=day()})}if(m.length)toast('Obat kedaluwarsa masuk karantina retur: '+m.join(', '))}
const SUP=[{n:'PBF Sehat Jaya (murah, lambat)',m:1,t:180,sh:200},{n:'PBF Cepat Medika (cepat, +25%)',m:1.25,t:90,sh:120}];
function ord(){const s=SUP[S.sup],pen=S.orders.map(o=>nm(o.k)+' - ±'+Math.max(0,Math.ceil((o.eta-S.t)/60))+' jam').join('<br>')||'tidak ada';
const rc=S.rcv.map((o,i)=>({t:'Terima & periksa paket: 20 '+nm(o.k),fn:()=>{recv(o);S.rcv.splice(i,1);addXP(8);toast('Jumlah & ED dicek, masuk stok');save();ord()}}));
const rt=S.ret.length?[{t:'Retur kedaluwarsa ('+S.ret.reduce((a,r)=>a+r.q,0)+' unit)',fn:()=>{const v=S.ret.reduce((a,r)=>a+r.q*MEDS[r.k].c*.5,0);S.ret=[];pay(v);toast('Retur diterima, kredit '+rp(v));save();ord()}}]:[];
modal('Penerimaan & Order PBF',`Pesanan berjalan:<br>${pen}<br><small>Pengiriman bisa terlambat (±30%). Obat kedaluwarsa tidak boleh dijual: retur ke PBF. Harga PBF saat ini ${pm()>1?'+':''}${Math.round((pm()-1)*100)}% dari harga dasar. Diskon langganan ${Math.round((1-supDisc())*100)}% (naik tiap 5 pesanan ke pemasok yang sama).</small>`,[...rc,...rt,{t:'Stock opname (hitung fisik)',fn:opname},{t:'Pemasok: '+s.n+' (ganti)',fn:()=>{S.sup=1-S.sup;ord()}},...Object.keys(MEDS).map(k=>{const c=Math.round(MEDS[k].c*20*s.m*pm()*supDisc()*(window.LIVE?LIVE.mul('pbf'):1));return{t:`Pesan 20 ${nm(k)} — ${rp(c)}${BLK(k)?' • 🚫 tanpa izin apotek':''}`,d:S.money<c||BLK(k),fn:()=>{pay(-c);S.sn=S.sn||[0,0];S.sn[S.sup]++;S.orders.push({k,s:S.sup,sh:s.sh,eta:S.t+s.t+(Math.random()<.3?180:0)});toast('Pesanan dikirim ke '+s.n);save();ord()}}}),{t:'Tutup'}])}

function lab(){modal('Laboratorium Racik','Pilih simulasi. Ini latihan pembelajaran, bukan panduan pembuatan obat.',LAB.map((r,i)=>({t:r.n+(S.lm&&S.lm[r.n]?' — nilai terbaik '+S.lm[r.n]:''),fn:()=>labT(i)})).concat([{t:'Tutup'}]))}
function labT(i,sel){sel=sel||[];const r=LAB[i],all=r.pool||(r.pool=shuf([...r.t,...r.x]));
modal(r.n+': pilih alat',`Pilih semua alat yang diperlukan (${sel.length} dipilih). Alat yang salah mengurangi nilai.`,all.map(a=>({t:(sel.includes(a)?'✓ ':'')+a,fn:()=>labT(i,sel.includes(a)?sel.filter(z=>z!=a):[...sel,a])})).concat([{t:'Mulai prosedur',d:!sel.length,fn:()=>labS(i,sel)},{t:'Batal',fn:lab}]))}
function labS(i,sel,n,e,o){const r=LAB[i];n=n||0;e=e||0;o=o||shuf(r.s);if(n==6)return labQ(i,sel,e);
modal(r.n+': prosedur',`Langkah ${n+1}/6 • kesalahan ${e}`,o.filter(s=>r.s.indexOf(s)>=n).map(s=>({t:s,fn:()=>{if(s==r.s[n])labS(i,sel,n+1,e,o);else{toast('Urutan salah!');labS(i,sel,n,e+1,o)}}})))}
function labQ(i,sel,e){const r=LAB[i],q=r.q,a=shuf([[q[1],100],[q[2],40],[q[3],0]]);
modal(r.n+': pemeriksaan hasil',q[0],a.map(x=>({t:x[0],fn:()=>labR(i,sel,e,x[1])})))}
function labR(i,sel,e,qs){const r=LAB[i],miss=r.t.filter(x=>!sel.includes(x)).length,extra=sel.filter(x=>!r.t.includes(x)).length;
const al=Math.max(0,100-(miss+extra)*20),pr=Math.max(0,100-e*15),qu=Math.round(qs*(al>=60?1:.7)),tot=Math.round(al*.25+pr*.3+100*.15+qu*.3),g=tot>=85?'A — layak diserahkan':tot>=65?'B — perlu perbaikan kecil':'C — ulangi, belum layak diserahkan';
S.lm=S.lm||{};S.lm[r.n]=Math.max(S.lm[r.n]||0,tot);const xp=Math.round((10+Math.round(tot/5))*(S.up&&S.up.lab?1.25:1));addXP(xp);if(tot>=65){S.d.lab++;wk('lab');claim()}if(tot>=85)S.rep=Math.min(100,S.rep+1);save();
modal('Hasil: '+r.n,`Pemilihan alat: <b>${al}</b> (kurang ${miss}, salah ${extra})<br>Ketepatan prosedur: <b>${pr}</b> (kesalahan ${e})<br>Kelengkapan proses: <b>100</b><br>Kualitas hasil: <b>${qu}</b><hr>Nilai akhir <b>${tot}</b> — Grade ${g}<br>+${xp} XP<br><small>Simulasi pembelajaran, bukan instruksi pembuatan obat.</small>`,[{t:'Simulasi lain',fn:lab},{t:'Tutup'}])}

<script>
/* ===== SISTEM KODE REDEEM ===== */
(function(){
  var DB=null,OWN=false,ID=null;
  async function init(){
    try{DB=await claude.use('db')}catch(e){}
    try{var U=await claude.use('user');if(U){OWN=await U.isOwner();ID=await U.id()}}catch(e){}
  }
  var tr=0;(function w(){if(window.claude&&claude.use)init();else if(tr++<40)setTimeout(w,500)})();
  async function sha(s){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('PL1:'+s.trim().toUpperCase()));return Array.from(new Uint8Array(b)).map(function(x){return('0'+x.toString(16)).slice(-2)}).join('')}
  function say(m){try{toast(m)}catch(e){}}
  function sum(d){var r=[];if(d.money)r.push('Rp'+Math.round(d.money).toLocaleString('id-ID'));if(d.xp)r.push(d.xp+' XP');if(d.item&&MEDS[d.item]&&d.qty)r.push(d.qty+' '+MEDS[d.item].n);if(d.cos&&window.COS){var cc=COS.filter(function(i){return i.id==d.cos})[0];if(cc)r.push('Kosmetik: '+cc.n)}return r.join(', ')||'(kosong)'}
  var IN='<input id="rd-in" autocomplete="off" autocapitalize="characters" onkeydown="event.stopPropagation()" style="width:100%;box-sizing:border-box;padding:8px;font-size:16px;text-transform:uppercase;border:2px solid #a28669;border-radius:6px;background:#fcfbf8;color:#474239">';
  window.rdUI=function(){
    var b=[{t:'Tukar kode',fn:redeem}];
    if(OWN)b.push({t:'Kelola kode (admin)',fn:adminUI});
    b.push({t:'Tutup'});
    modal('Kode Redeem','Masukkan kode untuk mendapat hadiah. Tiap kode hanya bisa dipakai sekali per pemain.<br><br>'+IN+(DB?'':'<br><small>Fitur ini butuh login claude.ai dan koneksi ke penyimpanan bersama.</small>'),b);
  };
  async function redeem(){
    var v=($('rd-in')||{}).value||'';
    if(!DB||!ID){say('Fitur redeem belum tersedia di sini');return}
    if(v.trim().length<4){say('Masukkan kode');return}
    try{
      var h=await sha(v),cs=await DB.doc('redeem_codes/'+h).get();
      if(!cs.exists){say('Kode tidak valid');return}
      var d=cs.data();
      if(d.exp&&Date.now()>d.exp){say('Kode sudah kedaluwarsa');return}
      var cl=DB.doc('redeem_claims/'+ID),cd=await cl.get(),hs=(cd.exists&&cd.data().h)||[];
      if(hs.indexOf(h)>=0){say('Kode ini sudah kamu pakai');return}
      var ud=DB.doc('redeem_uses/'+h),us=await ud.get(),n=(us.exists&&us.data().n)||0;

      try{await ud.set({n:n+1})}catch(e){}
      if(d.money)S.money+=d.money;
      if(d.xp)addXP(d.xp);if(d.cos&&window.cosGive)cosGive(d.cos);
      if(d.item&&MEDS[d.item]&&d.qty>0){S.stock[d.item]=(S.stock[d.item]||0)+d.qty;try{addB(d.item,d.qty)}catch(e){}}
      try{hud()}catch(e){}try{save()}catch(e){}
      modal('Redeem berhasil','Hadiah diterima: <b>'+sum(d)+'</b>',[{t:'Tutup'}]);
    }catch(e){say('Gagal memproses kode (cek login/izin)')}
  }
  function rnd(){var A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',s='';for(var i=0;i<10;i++)s+=A[Math.floor(Math.random()*A.length)];return s.slice(0,5)+'-'+s.slice(5)}
  var FI='style="width:100%;box-sizing:border-box;padding:6px;border:2px solid #a28669;border-radius:6px;background:#fcfbf8;color:#474239" onkeydown="event.stopPropagation()"';
  function adminUI(code){
    var opt='<option value="">— tidak ada —</option>'+Object.keys(MEDS).map(function(k){return'<option value="'+k+'">'+MEDS[k].n+'</option>'}).join('');
    var copt='<option value="">— tidak ada —</option>'+(window.COS||[]).map(function(i){return'<option value="'+i.id+'">'+i.n+'</option>'}).join('');var f=function(id,l,v){return'<label>'+l+'<input id="'+id+'" type="number" min="0" value="'+v+'" '+FI+'></label>'};
    modal('Buat kode redeem','<label>Kode (4-24 huruf/angka/tanda -)<input id="rc-c" value="'+(typeof code=='string'?code:'')+'" '+FI+'></label>'+f('rc-m','Uang (Rp)',0)+f('rc-x','XP',0)+'<label>Obat<select id="rc-i" '+FI+'>'+opt+'</select></label>'+f('rc-q','Jumlah obat',0)+'<label>Kosmetik<select id="rc-k" '+FI+'>'+copt+'</select></label>'+f('rc-u','Maks. pemakaian (0 = tak terbatas)',0)+f('rc-e','Berlaku (hari, 0 = tanpa batas)',0),
      [{t:'Kode acak',fn:function(){adminUI(rnd())}},{t:'Buat kode',fn:create},{t:'Daftar kode',fn:list},{t:'Kembali',fn:rdUI}]);
  }
  async function create(){
    var g=function(i){return($(i)||{}).value||''},c=g('rc-c').trim().toUpperCase();
    if(!/^[A-Z0-9-]{4,24}$/.test(c)){say('Format kode tidak valid');return}

    d.cos=g('rc-k');d.exp=e>0?Date.now()+e*86400000:0;
    if(!d.money&&!d.xp&&!(d.item&&d.qty)&&!d.cos){say('Isi minimal satu hadiah');return}
    try{var h=await sha(c);
      await DB.doc('redeem_codes/'+h).set(d);
      await DB.doc('redeem_admin/'+h).set({code:c,s:sum(d),max:d.max,exp:d.exp});
      modal('Kode dibuat','Kode: <b>'+c+'</b><br>Hadiah: '+sum(d)+'<br>Catat kode ini; hanya kamu yang bisa melihat daftarnya.',[{t:'Buat lagi',fn:adminUI},{t:'Daftar kode',fn:list}]);
    }catch(e){say('Gagal menyimpan (hanya pemilik di claude.ai)')}
  }
  async function list(){
    try{
      var q=await DB.collection('redeem_admin').get(),b=[];
      for(var i=0;i<q.docs.length;i++){var x=q.docs[i],a=x.data(),u=await DB.doc('redeem_uses/'+x.id).get();
        (function(id,a,n){b.push({t:'Hapus '+a.code+' — '+a.s+' — dipakai '+n+(a.max?'/'+a.max:'')+(a.exp&&Date.now()>a.exp?' (kedaluwarsa)':''),fn:async function(){try{await DB.doc('redeem_codes/'+id).delete();await DB.doc('redeem_admin/'+id).delete();say('Kode dihapus');list()}catch(e){say('Gagal menghapus')}}})})(x.id,a,(u.exists&&u.data().n)||0);
      }
      b.push({t:'Kembali',fn:adminUI});
      modal('Daftar kode',b.length>1?'Ketuk untuk menghapus kode.':'Belum ada kode.',b);
    }catch(e){say('Gagal memuat daftar')}
  }
})();
</script>

  if(p.issue){if(p.issue=='Alergi'){addXP(30);S.rep=Math.min(100,S.rep+3);SC.leaveP(p);L('Resep alergi dibatalkan & dirujuk ke dokter')}

  const lack=p.meds.filter(k=>S.stock[k]+(S.inv[k]||0)<1);if(lack.length){if(!p._lk){p._lk=1;L('Stok kosong: '+lack.map(nm).join(', '))}return}

 else if(r=='pik'&&p.stage==3&&!p.picked){let all=true;

 else if(r=='srh'&&p.stage==3){
  Object.keys(S.inv).filter(k=>S.inv[k]>0&&!p.meds.includes(k)).forEach(k=>{S.stock[k]+=S.inv[k];addB(k,S.inv[k]);S.inv[k]=0});

  p.meds.forEach(k=>S.inv[k]--);const en=S.en,ri=Q.reviewUI,sc=Math.random()<Math.min(.75,.4+lvl()*.05)?3:2,m0=S.money;

function pushLog(o){C.log.push(o);if(C.log.length>30)C.log.shift();renderLog()}
function renderLog(){
 const el=document.getElementById('coop-log');if(!el)return;
 el.innerHTML=C.log.slice(-8).map(l=>l.sys?'<i>'+esc(l.m)+'</i>':'<b>'+esc(l.n)+'</b>: '+esc(l.m)).join('<br>')||'<i>Belum ada pesan.</i>';
 el.scrollTop=el.scrollHeight}
const nameOf=(id,fb)=>C.remote[id]?C.remote[id].p.n:str(fb||'Pemain',14);

/* ---- penerima pesan ---- */
function onData(d,via){
 if(!d||typeof d!=='object'||typeof d.t!=='string')return;
 const f=C.host?via:str(d.f||via,80);
 if(f===C.myId)return;
 switch(d.t){
  case 'full':toast('Room penuh (maks '+MAX+' pemain)');C.leave(true);return;
  case 'p':{
   const p=clean(d.p);if(!p)return;
   const old=C.remote[f],isNew=!old,same=!!old&&old.dvSig===p.dv;
   C.remote[f]={p,ts:now(),dvSig:p.dv,dev:same?old.dev:false};
   if(p.dv&&!same)devVerify(f,p.dv).then(ok=>{const r=C.remote[f];if(r&&r.dvSig===p.dv)r.dev=ok});
   if(isNew){pushLog({sys:1,m:p.n+' bergabung'});toast(p.n+' bergabung \ud83e\udd1d')}
   if(C.host)bc({t:'p',f,p},via);
   return}
  case 'c':{
   const m=str(d.m,80);if(!m)return;const _t=now();if(_t-(RL[f]||0)<400)return;RL[f]=_t;
   const n=(C.remote[f]&&C.remote[f].dev?'\ud83d\udc51 ':'')+nameOf(f,d.n);
   pushLog({n,m});toast(n+': '+m);
   if(C.host)bc({t:'c',f,n,m},via);
   return}
  case 'g':
   if(d.to===C.myId)applyGift(d,f);
   else if(C.host&&C.conns[d.to])snd(C.conns[d.to],{t:'g',f,to:d.to,k:d.k,q:d.q,ed:d.ed});
   return;
  case 'm':{
   const x=num(d.x,0,6000),y=num(d.y,0,4800),r=C.remote[f];
   if(x===null||y===null||!r)return;
   r.p.x=x;r.p.y=y;r.ts=now();
   if(C.host)bc({t:'m',f,x,y},via);
   return}
  case 'pg':if(C.host)snd(C.conns[via],{t:'pn',ts:d.ts});return;
  case 'pn':if(typeof d.ts==='number'){C.ping=Math.max(0,now()-d.ts);C.pingTs=now()}return;
  case 'x':
   if(C.remote[f]){pushLog({sys:1,m:C.remote[f].p.n+' keluar'});delete C.remote[f]}
   if(C.host)bc({t:'x',f},via);
   return}}

function applyGift(d,f){
 const k=d.k,q=Math.floor(Number(d.q));
 if(typeof k!=='string'||!Object.prototype.hasOwnProperty.call(MEDS,k))return;
 if(!(q>=1&&q<=10)||C.rcvTot+q>60)return;
 if(typeof S==='undefined'||!S||!S.stock||typeof S.stock[k]!=='number')return;
 C.rcvTot+=q;S.stock[k]+=q;
 const ed=num(d.ed,1,1e6);
 try{ed?addB(k,q,ed):addB(k,q)}catch(e){}
 const n=nameOf(f);pushLog({sys:1,m:n+' mengirim '+q+' '+nm(k)});
 toast('\ud83c\udf81 '+n+' mengirim '+q+' '+nm(k));
 try{save()}catch(e){}}

C.say=function(text){
 const m=str(text,80).trim();if(!m||!C.on)return;
 pushLog({n:myName(),m});out({t:'c',f:C.myId,n:myName(),m})};

C.gift=function(toId,k,q){
 q=Math.floor(q);
 if(!C.on||!C.remote[toId])return toast('Pemain tidak ditemukan');
 if(!(q>=1&&q<=10)||!(S.stock[k]>=q))return toast('Stok '+nm(k)+' tidak cukup');
 let ed=1e6;try{const e=edOf(k);if(typeof e==='number')ed=e}catch(e){}
 for(let i=0;i<q;i++){try{takeB(k)}catch(e){}}
 S.stock[k]-=q;
 sendTo(toId,{t:'g',f:C.myId,to:toId,k,q,ed:ed===1e6?undefined:ed});
 pushLog({sys:1,m:'Kamu mengirim '+q+' '+nm(k)+' ke '+C.remote[toId].p.n});
 toast('\ud83c\udf81 Terkirim: '+q+' '+nm(k));try{save()}catch(e){}};

/* ---- koneksi ---- */
function loadPeer(){return new Promise((res,rej)=>{
 if(window.Peer)return res();let i=0;
 (function nx(){if(i>=SRC.length)return rej(new Error('Gagal memuat PeerJS. Cek koneksi internet.'));
  const s=document.createElement('script');s.src=SRC[i++];s.onload=()=>window.Peer?res():nx();s.onerror=nx;document.head.appendChild(s)})()})}

const gen=()=>Array.from({length:5},()=>AL[Math.floor(Math.random()*AL.length)]).join('');

function drop(id){
 const r=C.remote[id];delete C.conns[id];delete C.remote[id];
 if(r)pushLog({sys:1,m:r.p.n+' keluar'});
 if(C.host)bc({t:'x',f:id})}

C.leave=function(silent){
 TG.base=null;TG.tier=0;TG.last=-1;
 try{if(C.on)out({t:'x',f:C.myId})}catch(e){}
 const wasOn=C.on;
 try{Object.keys(C.conns).forEach(id=>{try{C.conns[id].close()}catch(e){}})}catch(e){}
 try{C.peer&&C.peer.destroy()}catch(e){}
 C.fullAt=0;C.ping=null;C.on=false;C.host=false;C.code='';C.peer=null;C.hostConn=null;C.conns={};C.remote={};C.myId=null;C.rcvTot=0;
 if(wasOn&&!silent)toast('Keluar dari room')};

function acceptConn(conn){
 if(Object.keys(C.conns).length>=MAX-1){conn.on('open',()=>{snd(conn,{t:'full'});setTimeout(()=>{try{conn.close()}catch(e){}},400)});return}
 conn.on('open',()=>{
  C.conns[conn.peer]=conn;snd(conn,{t:'hi'});
  for(const id in C.remote)snd(conn,{t:'p',f:id,p:C.remote[id].p});
  if(typeof me.x==='number')snd(conn,{t:'p',f:C.myId,p:me})});
 conn.on('data',d=>onData(d,conn.peer));
 conn.on('close',()=>drop(conn.peer));
 conn.on('error',()=>drop(conn.peer))}

C.hostRoom=async function(){
 await loadPeer();C.leave(true);
 for(let a=0;a<4;a++){
  const code=gen();
  try{
   await new Promise((res,rej)=>{
    const p=new Peer(PFX+code,PO());let done=false;
    const to=setTimeout(()=>{if(!done){done=true;try{p.destroy()}catch(e){}rej(new Error('Server sinyal tidak merespons'))}},12000);
    p.on('open',id=>{if(done)return;done=true;clearTimeout(to);C.peer=p;C.myId=id;C.host=true;C.code=code;C.on=true;res()});
    p.on('connection',acceptConn);
    p.on('disconnected',()=>{try{if(!p.destroyed)p.reconnect()}catch(e){}});
    p.on('error',e=>{if(!done){done=true;clearTimeout(to);try{p.destroy()}catch(x){}rej(e)}else toast('Koneksi: '+(e&&e.type||'error'))})});
   return C.code}
  catch(e){if(!(e&&e.type==='unavailable-id'))throw e}}
 throw new Error('Gagal membuat room, coba lagi')};

C.joinRoom=async function(code){
 code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
 if(code.length!==5)throw new Error('Kode room harus 5 karakter');
 await loadPeer();C.leave(true);
 return new Promise((res,rej)=>{
  const p=new Peer(undefined,PO());let done=false;
  const fail=m=>{if(done)return;done=true;clearTimeout(to);try{p.destroy()}catch(e){}C.peer=null;rej(new Error(m))};
  const to=setTimeout(()=>fail('Room tidak ditemukan atau koneksi gagal. Coba lagi.'),15000);
  p.on('open',id=>{
   C.myId=id;
   const c=p.connect(PFX+code,{reliable:true});
   c.on('data',d=>{
    if(!done&&d&&d.t==='hi'){done=true;clearTimeout(to);C.peer=p;C.hostConn=c;C.conns[c.peer]=c;C.code=code;C.host=false;C.on=true;res(code);return}
    if(!done&&d&&d.t==='full'){fail('Room penuh (maks '+MAX+' pemain)');return}
    if(C.on)onData(d,c.peer)});
   c.on('close',()=>{if(C.on&&C.hostConn===c){C.leave(true);toast('Room ditutup oleh host')}else fail('Koneksi ke host terputus')});
   c.on('error',()=>fail('Gagal terhubung ke host'))});
  p.on('error',e=>{if(!done)fail(e&&e.type==='peer-unavailable'?'Kode room tidak ditemukan':'Koneksi gagal ('+(e&&e.type||'error')+')')})})};

const _h=C.hostRoom;C.hostRoom=async function(){const r=await _h.apply(this,arguments);tgReset();refreshDev();return r};
const _j=C.joinRoom;C.joinRoom=async function(){const r=await _j.apply(this,arguments);try{const pp=C.peer;if(pp&&!pp._rc){pp._rc=1;pp.on('disconnected',()=>{try{if(!pp.destroyed)pp.reconnect()}catch(e){}})}}catch(e){}tgReset();refreshDev();return r};
/* ---- OPTIMASI KONEKSI: banyak STUN + relay bawaan PeerJS + TURN opsional + retry + tes jaringan ---- */
const STUN=['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302','stun:stun2.l.google.com:19302','stun:stun.cloudflare.com:3478','stun:global.stun.twilio.com:3478'];
const PJ_TURN={urls:['turn:eu-0.turn.peerjs.com:3478','turn:us-0.turn.peerjs.com:3478'],username:'peerjs',credential:'peerjsp'};
function userTurn(){try{const o=JSON.parse(localStorage.getItem('plturn')||'null');
 if(o&&typeof o.u==='string'&&typeof o.n==='string'&&o.n){const u=o.u.split(/[\s,]+/).filter(x=>/^turns?:[^\s]+$/.test(x)).slice(0,6);if(u.length)return{urls:u,username:o.n.slice(0,200),credential:String(o.c||'').slice(0,200)}}}catch(e){}return null}
const ICE=()=>{const a=[{urls:STUN},PJ_TURN],t=userTurn();if(t)a.unshift(t);return a};
const PO=()=>({debug:0,config:{iceServers:ICE(),sdpSemantics:'unified-plan',iceCandidatePoolSize:4}});

C.diag=()=>new Promise(res=>{
 if(typeof RTCPeerConnection==='undefined')return res({ok:false,msg:'Browser ini tidak mendukung WebRTC, jadi co-op tidak bisa jalan di sini.'});
 const c={host:0,srflx:0,relay:0};let pc,done=false;
 const fin=()=>{if(done)return;done=true;try{pc.close()}catch(e){}res({ok:true,c})};
 try{pc=new RTCPeerConnection({iceServers:ICE()});pc.createDataChannel('t');
  pc.onicecandidate=e=>{if(!e.candidate)return fin();const m=/ typ (host|srflx|relay)/.exec(e.candidate.candidate);if(m)c[m[1]]++};
  pc.createOffer().then(o=>pc.setLocalDescription(o)).catch(fin);setTimeout(fin,7000)}
 catch(e){res({ok:false,msg:'WebRTC gagal dibuat: '+((e&&e.message)||e)})}});

const mine=()=>Math.max(0,((typeof S!=='undefined'&&S&&S.tot)||0)-(TG.base==null?0:TG.base));
const teamTotal=()=>{let t=mine();for(const id in C.remote)t+=C.remote[id].p.sv||0;return t};
const tgTarget=()=>10*(TG.tier+1);
function tgReset(){TG.base=(typeof S!=='undefined'&&S&&S.tot)||0;TG.tier=0;TG.last=-1}
function tgClaim(){
 const t=TG.tier++,m=30000+10000*t,x=25+10*t;
 try{pay(m);addXP(x)}catch(e){}
 pushLog({sys:1,m:'Target Tim '+(t+1)+' tercapai! +'+rp(m)+' & +'+x+' XP'});
 toast('\ud83c\udfaf Target Tim '+(t+1)+' tercapai! +'+rp(m)+' & +'+x+' XP');
 try{sfx('xp')}catch(e){}try{save()}catch(e){}}

 if(!C.team())return '<div class="pxco-tg off"><i class="pxi star"></i><span>Target Tim aktif setelah ada teman yang bergabung.</span></div>';
 if(TG.tier>=TG.max)return '<div class="pxco-tg done"><i class="pxi trophy"></i><span>Semua Target Tim selesai. Hebat!</span></div>';
 const tg=tgTarget(),tot=Math.min(teamTotal(),tg),pc=Math.round(tot*100/tg),m=30000+10000*TG.tier;
 return '<div class="pxco-tg"><div class="pxco-tgh"><b>Target Tim '+(TG.tier+1)+'</b><span>'+tot+'/'+tg+' pasien</span></div><div class="pxseg"><i style="width:'+pc+'%"></i></div><div class="pxco-tgf"><span><i class="pxi coin"></i>'+rp(m)+'</span><span><i class="pxi bolt"></i>+'+(25+10*TG.tier)+' XP</span><span>Kamu: '+mine()+' pasien</span></div></div>'}

  [{t:'Kirim',fn:()=>{C.gift(document.getElementById('gf-to').value,document.getElementById('gf-k').value,+document.getElementById('gf-q').value);C.ui()}},{t:'Kembali',fn:C.ui}])}

 setInterval(()=>{const n=C.on?room.peers().length+1:0,k=n+'|'+C.on;if(b._k!==k){b._k=k;b.innerHTML='<i class="pxi team"></i>'+(C.on?'<em>'+n+'</em>':'');b.style.background=C.on?'var(--px-mt)':''}},1000)}

<script id="savemgr">
(()=>{
'use strict';
if(window.SV)return;
const SV=window.SV={};
const $g=id=>document.getElementById(id);
const IN='width:100%;box-sizing:border-box;padding:8px;font-size:16px;border:2px solid #b98652;border-radius:6px;background:#fffdf5;color:#3a3427';
const LS=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const LSset=(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){return false}};
const running=()=>typeof S!=='undefined'&&!!S&&$g('start').hidden;
const enc=s=>new TextEncoder().encode(s);
const dec=u=>new TextDecoder().decode(u);
const toB64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const fromB64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
const setMsg=m=>{const e=$g('sv-st');if(e)e.textContent=m;else toast(m)};

/* ---- validasi & hash ---- */
const okSave=o=>!!o&&typeof o==='object'&&typeof o.money==='number'&&typeof o.xp==='number'&&typeof o.t==='number'&&typeof o.name==='string'&&!!o.stock&&typeof o.stock==='object';
function fnv(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h.toString(16)}
async function sha(s){
 try{const h=new Uint8Array(await crypto.subtle.digest('SHA-256',enc(s)));return Array.from(h.slice(0,8),b=>b.toString(16).padStart(2,'0')).join('')}
 catch(e){return 'f:'+fnv(s)}}

/* ---- kompres ---- */
async function pipe(u8,Stream){
 const st=new Stream('gzip'),w=st.writable.getWriter();w.write(u8);w.close();
 return new Uint8Array(await new Response(st.readable).arrayBuffer())}

/* ---- bungkus / buka kode save ---- */
async function pack(obj){
 const env={g:'plife',v:1,t:Date.now(),n:String(obj.name||'').slice(0,14),d:obj,h:await sha(JSON.stringify(obj))};
 const json=JSON.stringify(env);
 if(typeof CompressionStream==='function')return 'PL1:'+toB64(await pipe(enc(json),CompressionStream));
 return 'PL0:'+toB64(enc(json))}

async function unpack(text){
 let t=String(text||'').trim();
 if(!t)throw new Error('Kotak kode masih kosong');
 let json;
 if(t[0]==='{')json=t;
 else{
  t=t.replace(/\s+/g,'');
  let m=/^(PL[01]):([A-Za-z0-9_-]+)$/.exec(t)||/(PL[01]):([A-Za-z0-9_-]{40,})$/.exec(t);
  if(!m)throw new Error('Format kode tidak dikenali. Kode save diawali "PL1:".');
  try{
   const u=fromB64(m[2]);
   if(m[1]==='PL1'){
    if(typeof DecompressionStream!=='function')throw new Error('Browser ini belum mendukung kode PL1. Perbarui browser.');
    json=dec(await pipe(u,DecompressionStream))}
   else json=dec(u)}
  catch(e){throw new Error(e&&/Perbarui/.test(e.message)?e.message:'Kode rusak atau terpotong. Salin ulang seluruhnya.')}}
 let env;try{env=JSON.parse(json)}catch(e){throw new Error('Isi save tidak bisa dibaca')}
 let obj,hashOk=true,ts=0;
 if(env&&env.g==='plife'){
  if(env.v>1)throw new Error('Save ini dibuat versi game yang lebih baru');
  obj=env.d;ts=env.t||0;
  const h=await sha(JSON.stringify(obj));hashOk=h===env.h||(String(env.h||'').startsWith('f:')&&env.h==='f:'+fnv(JSON.stringify(obj)))}
 else obj=env;
 if(!okSave(obj))throw new Error('Isi bukan save Pharmacy Life yang valid');
 return{obj,hashOk,ts:ts||obj.sv||0}}
SV.pack=pack;SV.unpack=unpack;

/* ---- IndexedDB (cadangan kedua, terpisah dari localStorage) ---- */
let _db=null;
const idb=()=>_db?Promise.resolve(_db):new Promise(res=>{try{const r=indexedDB.open('plife',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(_db=r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(e){res(null)}});
const idbGet=async k=>{const db=await idb();if(!db)return null;return new Promise(res=>{try{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch(e){res(null)}})};
const idbSet=async(k,v)=>{const db=await idb();if(!db)return;try{db.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(e){}};

/* ---- kumpulkan semua kandidat save yang ada di perangkat ---- */
async function candidates(){
 const L=[],seen=new Set();
 const add=(raw,lab)=>{if(!raw||seen.has(raw))return;seen.add(raw);let o=null;try{o=JSON.parse(raw)}catch(e){}L.push({lab,raw,obj:o,ok:okSave(o),t:(o&&o.sv)||0})};
 add(LS('plsave'),'Utama');add(LS('plsave_b1'),'Cadangan 1');add(LS('plsave_b2'),'Cadangan 2');
 add(await idbGet('main'),'Cadangan browser (IDB)');add(await idbGet('bak'),'Cadangan browser lama');
 return L.sort((a,b)=>(b.ok-a.ok)||(b.t-a.t))}
SV.candidates=candidates;

/* ---- simpan: bungkus save() bawaan ---- */
let lastBak=0,lastIdb=0,warned=false;
const _sv=save;
save=function(){
 if(typeof S==='undefined'||!S)return _sv.apply(this,arguments);
 const old=LS('plsave');
 try{S.sv=Date.now()}catch(e){}
 const r=_sv.apply(this,arguments);
 try{
  const nw=JSON.stringify(S),t=Date.now();
  if(LS('plsave')!==nw&&!warned){warned=true;toast('Penyimpanan browser diblokir. Pakai Menu > Backup untuk ekspor save!')}
  if(old&&old!==nw&&t-lastBak>180000){const b1=LS('plsave_b1');if(b1)LSset('plsave_b2',b1);LSset('plsave_b1',old);lastBak=t;idbSet('bak',old)}
  if(t-lastIdb>8000){lastIdb=t;idbSet('main',nw)}
 }catch(e){}
 return r};
SV.saveNow=()=>{try{if(running())save()}catch(e){}};
setInterval(SV.saveNow,30000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)SV.saveNow()});
window.addEventListener('pagehide',SV.saveNow);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ---- terapkan save hasil impor / pemulihan ---- */
function applySave(obj,hashOk){
 if(running()){try{const cur=LS('plsave');if(cur){const b1=LS('plsave_b1');if(b1)LSset('plsave_b2',b1);LSset('plsave_b1',cur)}}catch(e){}}
 const n=Object.assign(def(),obj);n.sv=Date.now();if(hashOk===false)n.tp=1;else if(hashOk===true)delete n.tp;
 const raw=JSON.stringify(n);
 if(!LSset('plsave',raw)){setMsg('Gagal menyimpan: penyimpanan browser diblokir');return false}
 idbSet('main',raw);
 if(running()){S=n;close();SC.scene.restart();toast('Save dimuat: '+n.name+' (Hari '+(Math.floor(n.t/1440)+1)+')')}
 else{const b=$g('s2');if(b)b.hidden=false;close();toast('Save masuk. Tekan "Lanjutkan permainan".')}
 return true}

const lvOf=o=>{let l=0;LV.forEach((v,i)=>{if(o.xp>=v)l=i});return l};
const when=t=>t?new Date(t).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'waktu tak diketahui';
const summary=o=>'<b>'+esc(o.name)+'</b> \u2022 Lv'+(lvOf(o)+1)+' \u2022 Hari '+(Math.floor(o.t/1440)+1)+' \u2022 '+rp(o.money);

SV.importText=async function(text){
 let r;try{r=await unpack(text)}catch(e){return setMsg(e&&e.message||'Gagal membaca save')}
 modal('\ud83d\udce5 Impor save?','<div style="font-size:13px;line-height:1.5">'+summary(r.obj)+'<br>Disimpan: '+when(r.ts)+(r.hashOk?'':'<br><b>\u26a0\ufe0f Pemeriksaan integritas gagal: data mungkin rusak atau diubah.</b>')+'<br><br>'+(running()?'Progres yang sedang berjalan akan diganti. Salinan otomatis disimpan di "Cadangan 1".':'Save ini akan jadi save utama di perangkat ini.')+'</div>',
  [{t:'Impor sekarang',fn:()=>applySave(r.obj,r.hashOk)},{t:'Batal',fn:SV.ui}])};

SV.pickFile=function(){
 const i=document.createElement('input');i.type='file';i.accept='.txt,.json,text/plain,application/json,*/*';
 i.onchange=async()=>{const f=i.files&&i.files[0];if(!f)return;if(f.size>5e6)return setMsg('File terlalu besar untuk save');
  let txt='';try{txt=await f.text()}catch(e){return setMsg('File tidak bisa dibaca')}SV.importText(txt)};
 i.click()};

SV.exportFile=async function(){
 if(!running())return;
 try{save()}catch(e){}
 const code=await pack(S),nmf=String(S.name||'Apoteker').replace(/[^\w-]+/g,'_').slice(0,14)||'Apoteker',fn='PharmacyLife_'+nmf+'_Hari'+day()+'.txt';
 const file=new File([code],fn,{type:'text/plain'});
 try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Save Pharmacy Life',text:'Save game Pharmacy Life: '+S.name});return toast('Save dibagikan')}}
 catch(e){if(e&&e.name==='AbortError')return}
 const u=URL.createObjectURL(file),a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
 setMsg('File diunduh: '+fn+'. Kalau tidak muncul, pakai "Salin kode save".')};

SV.copyCode=async function(){
 if(!running())return;
 try{save()}catch(e){}
 const code=await pack(S),ta=$g('sv-code');
 if(ta){ta.value=code;ta.focus();ta.select()}
 let ok=false;try{await navigator.clipboard.writeText(code);ok=true}catch(e){try{ok=document.execCommand('copy')}catch(x){}}
 setMsg(ok?'Kode disalin ('+Math.ceil(code.length/1000)+' KB). Tempel ke WA, lalu impor di tempat lain.':'Kode ada di kotak: tahan lalu pilih Salin.')};

SV.backupsUI=async function(){
 const L=(await candidates()).filter(c=>c.ok);
 if(!L.length)return modal('\ud83d\udd58 Cadangan','Belum ada cadangan di perangkat ini.',[{t:'Kembali',fn:SV.ui}]);
 modal('\ud83d\udd58 Cadangan otomatis','<div style="font-size:13px;line-height:1.5">Game menyimpan cadangan tiap beberapa menit. Pilih salah satu untuk dipulihkan:</div>',
  L.slice(0,5).map(c=>({t:c.lab+' \u2022 '+c.obj.name+' Hari '+(Math.floor(c.obj.t/1440)+1)+' \u2022 '+when(c.t),fn:()=>applySave(c.obj)})).concat([{t:'Kembali',fn:SV.ui}]))};

SV.ui=function(){
 const run=running();
 modal('\ud83d\udcbe Backup & Pindah Save',
  '<div style="font-size:13px;line-height:1.5">'+(run?'Save aktif: '+summary(S):'Belum ada game berjalan.')+'<br><br>Save disimpan di browser <b>per alamat web</b>, jadi save dari claude.ai tidak otomatis ada di GitHub Pages. Untuk memindahkan: <b>Ekspor</b> di tempat lama, kirim lewat WA, lalu <b>Impor</b> di tempat baru.<br><br><textarea id="sv-code" rows="3" placeholder="Tempel kode save di sini (diawali PL1:)" onkeydown="event.stopPropagation()" style="'+IN+'"></textarea><div id="sv-st" style="min-height:18px;font-size:12px;margin-top:4px"></div></div>',
  [{t:'\ud83d\udce4 Ekspor / bagikan file (WA)',d:!run,fn:SV.exportFile},
   {t:'\ud83d\udccb Salin kode save',d:!run,fn:SV.copyCode},
   {t:'\ud83d\udce5 Impor dari kode di kotak',fn:()=>SV.importText(($g('sv-code')||{}).value)},
   {t:'\ud83d\udcc1 Impor dari file',fn:SV.pickFile},
   {t:'\ud83d\udd58 Cadangan otomatis',fn:SV.backupsUI},
   {t:'Tutup'}])};

/* ---- menu in-game ---- */
const _m=menu;
menu=function(){
 _m.apply(this,arguments);
 try{
  const x=$g('mbtn'),last=x.lastElementChild;
  [['\ud83d\udcbe Backup / Impor / Ekspor save',()=>SV.ui()],['\ud83e\uddd1\u200d\ud83d\udcbb Mode developer',()=>window.COOP&&COOP.devUI()]].forEach(([t,fn])=>{
   const b=document.createElement('button');b.textContent=t;b.onclick=()=>{if(performance.now()-MO<400)return;fn()};x.insertBefore(b,last)})}
 catch(e){}};

/* di layar judul, modal harus tampil di atas #start (sama-sama z-index 5 di game asli) */
{const st=document.createElement('style');st.textContent='body:has(#modal:not([hidden])) #sfs{display:none!important}body:has(#start:not([hidden])) #modal{z-index:200!important}';document.head.appendChild(st)}

/* ---- layar judul: Lanjutkan yang lebih aman + tombol Impor ---- */
const s2=$g('s2');
if(s2){
 s2.onclick=async()=>{
  const L=(await candidates()).filter(c=>c.ok);
  if(!L.length){toast('Tidak ada save valid di perangkat ini. Coba impor.');return SV.ui()}
  const b=L[0];if(b.lab!=='Utama')toast('Save utama bermasalah, memuat: '+b.lab);
  S=Object.assign(def(),b.obj);begin()};
 const b3=document.createElement('button');b3.id='s3';b3.type='button';b3.textContent='\ud83d\udce5 Impor save (file / kode)';
 b3.onclick=()=>SV.ui();s2.insertAdjacentElement('afterend',b3);
 candidates().then(L=>{if(L.some(c=>c.ok))s2.hidden=false})}
})();
</script>

let was=false;
function reset(){
 Object.assign(DEV,{freeze:false,speed:1,god:false,patient:false,noclip:false,spd:1,dbg:false,mark:null});
 try{if(live())SC.pl.body.checkCollision.none=false}catch(e){}}
function apply(){
 const d=on(),inGame=!!g('start')&&g('start').hidden;
 if(d!==was){was=d;if(!d)reset();else if(!DEV.manual&&live())toast('Mode developer aktif \ud83d\udc51')}
 let b=g('bdev');
 if(d&&!b){b=document.createElement('button');b.id='bdev';b.type='button';b.title='Konsol Developer (tombol `)';b.textContent='\ud83d\udee0\ufe0f';b.onclick=()=>toggle();g('bt').appendChild(b)}
 if(b){if(d)b.hidden=!inGame;else b.remove()}
}
setInterval(apply,400);

{const _om=Main.prototype.onMin;

  {t:'\u23e9 Kecepatan waktu: \u00d7'+DEV.speed+' (ganti)',on:DEV.speed>1,fn:()=>{DEV.speed=SPEEDS[(SPEEDS.indexOf(DEV.speed)+1)%SPEEDS.length];pgTime()}},

<script id="lbcf">
/* Leaderboard v2 (pixel arcade): cache + stale-while-revalidate, timeout, retry, dedupe kirim skor, kirim saat tab ditutup.
   Mendukung Cloudflare Worker (/score, /scores) dan Firestore claude.ai (NET.db). */
(function(){
const API=location.origin,ready=()=>/^https?:\/\//.test(API);
const IDRE=/^[A-Za-z0-9-]{16,64}$/;
const gen=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function devId(){let d=lsGet('plDevId');if(!IDRE.test(d||'')){d=gen();lsSet('plDevId',d)}return d}
/* ID leaderboard disimpan DI DALAM save (S.lid). Save yang sama di perangkat lain = ID sama = 1 entri.
   Save lama tanpa lid mewarisi plLbId perangkat agar entri lamanya tetap nyambung. */
function pid(){
 const d=lsGet('plLbId');
 if(typeof S!=='undefined'&&S){
  if(!IDRE.test(S.lid||''))S.lid=IDRE.test(d||'')?d:gen();
  if(!IDRE.test(d||''))lsSet('plLbId',S.lid);
  return S.lid}
 if(IDRE.test(d||''))return d;const n=gen();lsSet('plLbId',n);return n}
const cleanName=()=>String((typeof S!=='undefined'&&S&&S.name)||'Apoteker').replace(/[\u0000-\u001f\u007f<>&"']/g,'').trim().slice(0,14)||'Apoteker';
const sub0=lbSubmit,TTL=25000,sleep=ms=>new Promise(r=>setTimeout(r,ms));
const CA={t:0,rows:null};let SEQ=0,lastSc=-1,lastT=0,fly=null;
const body=()=>JSON.stringify({v:2,id:pid(),dev:devId(),name:cleanName(),score:Math.max(0,Math.floor(score())),lv:lvl()+1,sv:Number(S.sv)||0});
async function getJSON(u,ms){const c=new AbortController(),to=setTimeout(()=>c.abort(),ms);try{const r=await fetch(u,{signal:c.signal,cache:'no-store'});if(!r.ok)throw new Error('http '+r.status);return await r.json()}finally{clearTimeout(to)}}
lbSubmit=async function(f){
 if(typeof S==='undefined'||!S||S.tp)return;
 const sc=score(),t=Date.now();
 if(!Number.isFinite(sc)||sc<0||sc>1e9)return;
 if(!f&&((sc===lastSc&&t-lastT<300000)||t-lastT<60000))return;
 if(NET.db&&NET.id){lastSc=sc;lastT=t;return sub0(f)}
 if(!ready())return;
 if(fly)return fly;
 lastSc=sc;lastT=t;NET.ls=t;
 fly=(async()=>{const c=new AbortController(),to=setTimeout(()=>c.abort(),8000);
  try{await fetch(API+'/score',{method:'POST',headers:{'Content-Type':'application/json'},body:body(),signal:c.signal,keepalive:true})}
  catch(e){lastT=0}finally{clearTimeout(to);fly=null}})();
 return fly};

<script id="live-ops">
/* ===== LIVE OPS: event global + siaran developer berbingkai mewah =====
   - Siaran ditandatangani ECDSA (kunci developer yang sama dengan "Mode developer"), jadi tidak bisa dipalsukan pemain.
   - Dibaca lewat db bersama (onSnapshot, real-time) dan/atau live.json (hosting sendiri). Tidak butuh co-op.
   - Efek: pendapatan, XP, ramai pelanggan, kesabaran pelanggan, hemat energi, diskon PBF, hadiah sekali klaim. */
(function(){
var DEVPUB={kty:'EC',crv:'P-256',x:'5KzP_YO5lKrbP3Cb136R9QlXknULf4MZPcsPyLKUMZQ',y:'Hc-rlggVe8tY-UWbI4tBfP5J2EYURrtIvZIGVxUbsQ8',ext:true};
var ALG={name:'ECDSA',hash:'SHA-256'},KALG={name:'ECDSA',namedCurve:'P-256'},PFX='plife-live|';
var enc=function(s){return new TextEncoder().encode(s)};
var toB64=function(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
var fromB64=function(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var $=function(i){return document.getElementById(i)};
var LS={g:function(k){try{return localStorage.getItem(k)}catch(e){return null}},s:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
var TIERS={silver:'Pengumuman',gold:'Maklumat Emas',royal:'Dekrit Kerajaan',mythic:'Siaran Mythic'};

/* ---------- waktu (dikoreksi ke jam server agar tidak bisa curang lewat jam HP) ---------- */
var off=0;
var now=function(){return Date.now()+off};
function syncClock(){try{if(!/^https?:/.test(location.protocol))return;fetch(location.href,{method:'HEAD',cache:'no-store'}).then(function(r){var d=Date.parse(r.headers.get('Date')||'');if(d&&Math.abs(d-Date.now())<864e5)off=d-Date.now()}).catch(function(){})}catch(e){}}

/* ---------- penyimpanan siaran terverifikasi ---------- */
var ITEMS={};       // id -> payload terverifikasi
var RAW={};         // id -> {p,s} untuk cache offline
var pubKey=null;
function getPub(){return pubKey?Promise.resolve(pubKey):crypto.subtle.importKey('jwk',DEVPUB,KALG,false,['verify']).then(function(k){return pubKey=k})}
function verify(p,s){return getPub().then(function(k){return crypto.subtle.verify(ALG,k,fromB64(s),enc(PFX+p))}).catch(function(){return false})}
function clampFx(f){f=f||{};var o={},n=function(v,a,b){v=+v;return isFinite(v)?Math.min(b,Math.max(a,v)):0};
  if(f.inc>1)o.inc=n(f.inc,1,10);if(f.xp>1)o.xp=n(f.xp,1,10);if(f.crowd>1)o.crowd=n(f.crowd,1,5);if(f.pat>1)o.pat=n(f.pat,1,5);
  if(f.en>0&&f.en<1)o.en=n(f.en,.1,1);if(f.pbf>0&&f.pbf<1)o.pbf=n(f.pbf,.3,1);return o}
function accept(raw){
  if(!raw||typeof raw.p!=='string'||typeof raw.s!=='string')return Promise.resolve(false);
  return verify(raw.p,raw.s).then(function(ok){
    if(!ok)return false;var d;try{d=JSON.parse(raw.p)}catch(e){return false}
    if(!d||!/^[A-Za-z0-9_-]{4,40}$/.test(d.id||''))return false;
    d.fx=clampFx(d.fx);d.t0=+d.t0||0;d.t1=+d.t1||0;
    if(d.k==='chat'){d.bd=String(d.bd||'').slice(0,140);if(!d.bd||!d.t0)return false;if(!seen[d.id]&&!CQ.some(function(q){return q.id===d.id}))CQ.push(d);return true}
    if(d.gf){d.gf={m:Math.min(5e6,Math.max(0,+d.gf.m||0)),x:Math.min(5e4,Math.max(0,+d.gf.x||0))};if(!d.gf.m&&!d.gf.x)d.gf=null}
    d.tr=TIERS[d.tr]?d.tr:'gold';
    ITEMS[d.id]=d;RAW[d.id]={p:raw.p,s:raw.s};return true})}
function acceptAll(list){return Promise.all((list||[]).map(accept)).then(function(r){if(r.some(Boolean)){cacheSave();tick(true)}})}
function cacheSave(){var ids=Object.keys(RAW).sort(function(a,b){return(ITEMS[b]?ITEMS[b].t0:0)-(ITEMS[a]?ITEMS[a].t0:0)}).slice(0,40);LS.s('pllive_c',JSON.stringify(ids.map(function(i){return RAW[i]})))}
function cacheLoad(){try{acceptAll(JSON.parse(LS.g('pllive_c')||'[]'))}catch(e){}}
function removeIds(keep){Object.keys(ITEMS).forEach(function(i){if(!keep[i]){delete ITEMS[i];delete RAW[i]}});cacheSave()}

/* ---------- efek aktif ---------- */
function isActive(d,t){t=t||now();return d.t0<=t&&t<d.t1}
function hasFx(d){return Object.keys(d.fx||{}).length>0}
function activeEvents(){var t=now();return Object.keys(ITEMS).map(function(i){return ITEMS[i]}).filter(function(d){return hasFx(d)&&isActive(d,t)}).sort(function(a,b){return a.t1-b.t1})}
function mul(k){var a=activeEvents(),v=1;a.forEach(function(d){var x=d.fx[k];if(!x)return;v=(k==='en'||k==='pbf')?Math.min(v,x):Math.max(v,x)});return v}

/* ---------- hook ke game ---------- */
function hook(){
  try{if(typeof pay==='function'&&!pay._lx){var p0=pay;pay=function(n){var m=mul('inc');if(n>0&&m>1)n=Math.round(n*m);return p0.call(this,n)};pay._lx=1}}catch(e){}
  try{if(typeof addXP==='function'&&!addXP._lx){var x0=addXP;addXP=function(n){var m=mul('xp');if(n>0&&m>1)n=Math.round(n*m);return x0.call(this,n)};addXP._lx=1;xpRaw=x0}}catch(e){}
  try{if(typeof enCost==='function'&&!enCost._lx){var e0=enCost;enCost=function(p){var c=e0.call(this,p),m=mul('en');return m<1?Math.max(1,Math.round(c*m)):c};enCost._lx=1}}catch(e){}
}
var xpRaw=null,lastTick=0;
function inGame(){try{return typeof S!=='undefined'&&S&&typeof SC!=='undefined'&&SC&&SC.pl&&SC.q}catch(e){return false}}
function idle(){try{return inGame()&&$('start')&&$('start').hidden&&!$('intro')&&!$('devintro')&&!$('lx-ov')}catch(e){return false}}
function gameFx(dt){
  if(!inGame()||busy)return;
  var c=mul('crowd');if(c>1&&typeof SC.sp==='number')SC.sp=Math.min(SC.sp,28000/c);
  var pt=mul('pat');if(pt>1&&SC.pts){var k=dt*(1-1/pt);SC.pts.forEach(function(p){if(!p.leave&&p.stage==0&&!p.called&&p.w>0)p.w=Math.max(0,p.w-k)})}
}

/* ---------- format ---------- */
function fmtT(ms){ms=Math.max(0,ms);var s=Math.floor(ms/1e3),h=Math.floor(s/3600),m=Math.floor(s%3600/60);s%=60;var z=function(n){return(n<10?'0':'')+n};return h?h+':'+z(m)+':'+z(s):z(m)+':'+z(s)}
function rpf(n){return 'Rp'+Math.round(n).toLocaleString('id-ID')}
function fxLines(f){var o=[];
  if(f.inc)o.push(['\u{1F4B0}','Pendapatan','\u00d7'+f.inc]);if(f.xp)o.push(['\u2728','XP','\u00d7'+f.xp]);
  if(f.crowd)o.push(['\u{1F30A}','Pelanggan datang','\u00d7'+f.crowd+' lebih ramai']);if(f.pat)o.push(['\u{1F60C}','Kesabaran pelanggan','\u00d7'+f.pat]);
  if(f.en)o.push(['\u{1F50B}','Biaya energi','\u2212'+Math.round((1-f.en)*100)+'%']);if(f.pbf)o.push(['\u{1F3F7}\uFE0F','Harga order PBF','\u2212'+Math.round((1-f.pbf)*100)+'%']);return o}
function chipText(f){if(f.inc)return'Cuan \u00d7'+f.inc;if(f.crowd)return'Ramai \u00d7'+f.crowd;if(f.xp)return'XP \u00d7'+f.xp;if(f.pbf)return'PBF \u2212'+Math.round((1-f.pbf)*100)+'%';if(f.en)return'Hemat energi';return'Event'}

/* ---------- hadiah ---------- */
function claimed(id){try{if(S&&S.live&&S.live.c&&S.live.c[id])return true}catch(e){}try{return !!(JSON.parse(LS.g('pllive_cl')||'{}')[id])}catch(e){return false}}
function claim(d){
  if(!d.gf||claimed(d.id)||!inGame())return false;
  S.live=S.live||{};S.live.c=S.live.c||{};S.live.c[d.id]=1;
  try{var o=JSON.parse(LS.g('pllive_cl')||'{}');o[d.id]=1;LS.s('pllive_cl',JSON.stringify(o))}catch(e){}
  if(d.gf.m)S.money+=d.gf.m;if(d.gf.x)(xpRaw||addXP)(d.gf.x);
  try{hud()}catch(e){}try{save()}catch(e){}try{sfx('coin');setTimeout(function(){sfx('xp')},250)}catch(e){}return true}

/* ---------- popup berbingkai mewah ---------- */
var Q=[],CQ=[],seen={},CUR=null;try{seen=JSON.parse(LS.g('pllive_seen')||'{}')}catch(e){}
/* Pesan biasa (tanpa event/hadiah) hanya tayang untuk pemain yang sedang online saat dikirim.
   Pemain baru / save baru / tab yang baru dibuka setelah jendela ini lewat TIDAK akan melihatnya. */
var MSG_WIN=60000;
function stale(d){var t=now();if(d.t1&&t>=d.t1)return true;return !hasFx(d)&&!d.gf&&t-d.t0>MSG_WIN}
function popup(d,force){
  if(CUR){try{CUR()}catch(e){}CUR=null}
  var old=$('lx-ov');if(old)old.remove();
  var ov=document.createElement('div');ov.id='lx-ov';ov.setAttribute('data-tr',d.tr);
  var act=hasFx(d)&&isActive(d),gf=d.gf,cl=gf&&claimed(d.id);
  var pills=fxLines(d.fx||{}).map(function(r){return'<span class="lx-pl">'+r[0]+' <b>'+esc(String(r[2]).replace(' lebih ramai',''))+'</b></span>'}).join('');
  if(gf)pills+='<span class="lx-pl">\u{1F381} <b>'+[gf.m?rpf(gf.m):'',gf.x?gf.x+' XP':''].filter(Boolean).join(' + ')+'</b></span>';
  var tm=hasFx(d)?'<span class="lx-tm" id="lx-tm">'+(act?'\u23F1 '+fmtT(d.t1-now()):(now()<d.t0?'segera':'selesai'))+'</span>':'';
  var stay=!!(gf&&!cl),ms=stay?0:Math.min(24000,12000+(d.bd||'').length*45);
  ov.innerHTML='<div class="lx-fr"><div class="lx-in"><i class="lx-c a"></i><i class="lx-c b"></i><i class="lx-c c"></i><i class="lx-c d"></i>'
   +'<div class="lx-med">'+esc(d.em||'\u{1F451}')+'</div>'
   +'<div class="lx-tx"><div class="lx-k">\u{1F451} '+esc(TIERS[d.tr])+'</div><div class="lx-t">'+esc(d.ti||'Pesan Developer')+'</div>'
   +(d.bd?'<div class="lx-b">'+esc(d.bd).replace(/\n/g,'<br>')+'</div>':'')
   +((pills||tm)?'<div class="lx-row">'+pills+tm+'</div>':'')+'</div>'
   +(stay?'<button class="lx-cl" id="lx-cl">\u{1F381} Klaim</button>':'')
   +'<button class="lx-x" id="lx-x" aria-label="Tutup">\u2715</button>'
   +(ms?'<i class="lx-bar" style="animation-duration:'+ms+'ms"></i>':'')+'</div></div>';
  document.body.appendChild(ov);
  try{sfx('xp')}catch(e){}
  var iv=setInterval(function(){var e=$('lx-tm');if(!e){clearInterval(iv);return}if(hasFx(d)&&isActive(d))e.textContent='\u23F1 '+fmtT(d.t1-now())},1000),to=null,gone=false;
  var self=function(){close(true)};CUR=self;
  function close(q){if(gone)return;gone=true;clearInterval(iv);clearTimeout(to);if(CUR===self)CUR=null;if(q===true){ov.remove();return}ov.classList.add('out');setTimeout(function(){ov.remove();pump()},230)}
  $('lx-x').onclick=close;
  var c=$('lx-cl');if(c)c.onclick=function(){if(claim(d)){var r=ov.querySelector('.lx-cl');r.outerHTML='<span class="lx-got">\u2705 Masuk kas</span>';var bar=ov.querySelector('.lx-bar');if(bar)bar.remove();to=setTimeout(close,2200)}else{try{toast('Hadiah ini sudah diklaim')}catch(e){}close()}};
  if(ms)to=setTimeout(close,ms);
  if(!force){seen[d.id]=1;LS.s('pllive_seen',JSON.stringify(seen))}
}
/* ---------- Chat Developer: bubble singkat tanpa efek, hanya untuk yang online saat dikirim ---------- */
var CHAT_WIN=45000,CHAT_POLL=2000,chatTo=null,chatBusy=false,chatFail=0,chatLast=0;
/* Cek chat tiap CHAT_POLL ms lewat /chat (kecil & ringan). Hanya saat tab terlihat dan pemain sedang di dalam game.
   Bila server error 3x beruntun, melambat ke 15 detik sampai pulih. */
function pullChat(){
  if(chatBusy||document.visibilityState!=='visible'||!/^https?:/.test(location.protocol)||!inGame())return;
  var t=Date.now();if(chatFail>=3&&t-chatLast<15000)return;
  chatBusy=true;chatLast=t;
  fetch(location.origin+'/chat',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
    chatFail=0;
    var l=((j&&j.items)||[]).filter(function(x){try{return !seen[JSON.parse(x.p).id]}catch(e){return false}});
    if(l.length)acceptAll(l)}).catch(function(){chatFail++}).then(function(){chatBusy=false})}
function chatPump(){
  if(!CQ.length)return;var t=now();
  CQ=CQ.filter(function(c){return !seen[c.id]&&t-c.t0<=CHAT_WIN&&t<c.t1});
  if(!CQ.length||!inGame())return;
  var d=CQ[CQ.length-1];CQ.forEach(function(c){seen[c.id]=1});CQ=[];
  try{LS.s('pllive_seen',JSON.stringify(seen))}catch(e){}
  showChat(d)}
function showChat(d){
  var o=$('lx-chat');if(o)o.remove();clearTimeout(chatTo);
  var b=document.createElement('div');b.id='lx-chat';

<script id="bank-sentral">
/* ===== BANK SENTRAL APOTEK v2: penstabil ekonomi + fitur interaktif ===== */
(function(){

var P={
 tgtMin:1000000,tgtDays:8,tgtInc:7,tgtLv:.1,

};

 seimbang:{n:'Seimbang',tax:1,k:.4,lo:-.10,hi:.12,sub:1,int:1,d:'Pengaturan standar.'},
 ketat:{n:'Ketat',tax:1.5,k:.3,lo:-.05,hi:.08,sub:1.4,int:1.3,d:'Pajak berat, harga PBF sangat stabil, subsidi dan bunga besar.'}
};
function E(){var e=S.eco;if(!e||typeof e!=='object')e=S.eco={};
 ['fund','tax','flow','sub','burn','cd','cr','lock','stDay','streak','intg','don'].forEach(function(k){if(typeof e[k]!=='number'||!isFinite(e[k]))e[k]=0});
 if(!Array.isArray(e.h))e.h=[];if(!Array.isArray(e.dep))e.dep=[];

 if(!e.seeded){e.seeded=1;e.fund+=P.seed}

function st(){return ST[E().st]}
function cost(){var c=(S.ch===0?0:50000)+(S.emp||[]).reduce(function(a,x){return a+(x.s||0)},0);return Math.max(50000,c)}
function avgInc(){var h=(S.hist||[]).slice(-7);return h.length?h.reduce(function(a,x){return a+(x.i||0)},0)/h.length:0}
function target(){var l=typeof lvl==='function'?lvl():0;return Math.round(Math.max(P.tgtMin,P.tgtDays*cost(),P.tgtInc*avgInc())*(1+P.tgtLv*Math.sqrt(l))/1000)*1000}

function depTotal(){return E().dep.reduce(function(a,x){return a+x.p},0)}
function zone(){var T=target(),m=S.money;
 if(m<.25*T)return{n:'Kering',c:'#d9534f',d:'Kas tipis, subsidi bisa cair.'};
 if(m<1.5*T)return{n:'Sehat',c:'#2e9e7a',d:'Arus kas seimbang.'};
 if(m<taxStart())return{n:'Longgar',c:'#c9961a',d:'Kas mulai banyak, belum dikenai pajak.'};
 return{n:'Menumpuk',c:'#e8833a',d:'Kas menumpuk, pajak penumpukan berjalan.'}}
function priceIdx(){var pmv=typeof pm==='function'?pm():1,m=1;try{m=window.LIVE&&LIVE.__raw?LIVE.__raw('pbf'):1}catch(x){}
 var e=E(),s=st(),raw=pmv*m,eff=day()<=e.lock?1:1+Math.max(s.lo,Math.min(s.hi,(raw-1)*s.k));return{raw:raw,eff:eff,pm:pmv}}
function advice(){var a=[],z=zone(),T=target(),e=E(),pi=priceIdx();
 if(z.n==='Menumpuk')a.push('Kas sudah kena pajak. Simpan di Deposito (bebas pajak), donasi (kredit pajak), atau belanjakan ke renovasi.');
 else if(S.money>.8*taxStart())a.push('Kas hampir menyentuh batas pajak ('+rp(taxStart())+'). Pertimbangkan Deposito atau donasi.');
 if(z.n==='Kering'){a.push(e.loan?'Kas tipis. Subsidi cair otomatis bila jeda sudah lewat.':'Kas tipis. Ajukan Pinjaman Usaha atau tunggu subsidi.')}

function settle(inc){
 var e=E(),T=target(),c=cost(),s=st(),d=day(),o={flow:0,tax:0,sub:0,emg:0,burn:0,loan:0,late:0,dint:0,dmat:0,cr:0};
 var L=e.loan;
 if(L){var due=Math.min(L.inst,L.left),pd=Math.min(due,Math.max(0,S.money));
  S.money-=pd;e.fund+=pd;L.left-=pd;o.loan=pd;
  if(pd<due){L.late=(L.late||0)+1;o.late=1;L.left+=Math.round((due-pd)*P.loanLate);S.rep=Math.max(0,(S.rep||0)-1)}
  if(L.left<=0)e.loan=null}
 e.dep=e.dep.filter(function(x){if(d<x.due)return true;
  var it=Math.min(Math.round(x.p*x.r),Math.floor(e.fund*P.depPayFund));
  e.fund-=it;S.money+=x.p+it;o.dint+=it;o.dmat+=x.p;e.intg+=it;return false});
 var av=Math.max(0,S.money);
 o.flow=Math.min(av,Math.round(Math.max(0,inc-P.flowFree)*P.flowRate));av-=o.flow;
 var tx=Math.round(wtax(wealth(),tb())*s.tax),cu=Math.min(e.cr,tx);tx-=cu;e.cr-=cu;o.cr=cu;
 o.tax=Math.min(av,tx);
 S.money-=o.flow+o.tax;e.fund+=o.flow+o.tax;e.tax+=o.tax;e.flow+=o.flow;
 var D=Math.max(100000,P.dangerDays*c);
 if(S.money<D&&d>=e.cd){
  var need=Math.min(D-S.money,Math.round(P.subDays*c*s.sub)),g=Math.min(need,Math.floor(e.fund));
  if(g>0){e.fund-=g;o.sub=g}
  else if(S.money<c){o.emg=Math.round(P.emgDays*c)}
  if(o.sub+o.emg>0){S.money+=o.sub+o.emg;e.sub+=o.sub+o.emg;e.cd=d+(o.sub>0?P.subCd:P.subCd+2)}}
 var cap=P.fundCap*T;if(e.fund>cap){o.burn=Math.round(e.fund-cap);e.fund-=o.burn;e.burn+=o.burn}
 e.fund=Math.round(e.fund);
 var z=zone();e.streak=(z.n==='Sehat'||z.n==='Longgar')?e.streak+1:0;
 e.h.push({d:d-1,k:Math.round(S.money),T:T,x:o.flow+o.tax,s:o.sub+o.emg});e.h=e.h.slice(-14);
 e.last=o;return o}
function bar(){var T=target(),ts=taxStart(),M=ts*1.5,f=function(x){return Math.min(100,x/M*100)},p=Math.max(0,f(S.money));
 return'<div style="position:relative;height:12px;border-radius:6px;background:linear-gradient(90deg,#d9534f 0 '+f(.25*T)+'%,#2e9e7a '+f(.25*T)+'% '+f(1.5*T)+'%,#e6bf4a '+f(1.5*T)+'% '+f(ts)+'%,#e8833a '+f(ts)+'% 100%);margin:4px 0 2px"><i style="position:absolute;left:calc('+p+'% - 2px);top:-3px;width:4px;height:18px;background:#263a52;border:1px solid #fff;border-radius:2px"></i></div><small style="display:flex;justify-content:space-between;opacity:.7"><span>0</span><span>target '+rp(T)+'</span><span>pajak mulai '+rp(ts)+'</span></small>'}
function done(msg){if(msg&&typeof toast==='function')toast(msg);save();hud()}
function back(){return typeof fin==='function'?fin:close}
/* ---------- panel utama ---------- */
function panel(){
 var e=E(),T=target(),z=zone(),pi=priceIdx(),l=e.last,s=st(),h=e.h.slice(-7),ad=advice();
 var rows=h.map(function(x){return'H'+x.d+': kas '+rp(x.k)+(x.x?' • iuran −'+rp(x.x):'')+(x.s?' • subsidi +'+rp(x.s):'')}).join('<br>')||'<i>Belum ada riwayat. Selesaikan satu hari.</i>';
 var lock=day()<=e.lock?'aktif sampai hari '+e.lock:'tidak aktif';
 var rew=Math.min(Math.floor(e.fund*P.streakFund),Math.round(P.streakRewX*cost()));
 modal('Bank Sentral Apotek','Status: <b style="color:'+z.c+'">'+z.n+'</b> — '+z.d+'<br>Kas: <b>'+rp(S.money)+'</b> • Target kas: <b>'+rp(T)+'</b>'+bar()+
 '<br>Kebijakan: <b>'+s.n+'</b> • Dana Stabilisasi: <b>'+rp(e.fund)+'</b><br>Indeks harga PBF: <b>×'+pi.eff.toFixed(2)+'</b> <small>(tanpa penyangga ×'+pi.raw.toFixed(2)+')</small> • Kontrak harga: '+lock+
 '<br>Deposito: <b>'+rp(depTotal())+'</b> ('+e.dep.length+') • Pinjaman: <b>'+(e.loan?rp(e.loan.left):'tidak ada')+'</b> • Kredit pajak: <b>'+rp(e.cr)+'</b><br>Streak stabil: <b>'+e.streak+'/'+P.streakN+'</b> hari'+
 (ad.length?'<hr><b>Saran</b><br>'+ad.map(function(x){return'• '+x}).join('<br>'):'')+
 '<hr><b>Penutupan terakhir</b><br>'+(l?'Iuran −'+rp(l.flow)+' • Pajak −'+rp(l.tax)+(l.cr?' (kredit '+rp(l.cr)+')':'')+'<br>Subsidi +'+rp(l.sub+l.emg)+' • Cicilan −'+rp(l.loan)+' • Bunga deposito +'+rp(l.dint)+' • Dibakar '+rp(l.burn):'<i>Belum ada.</i>')+
 '<hr><b>7 hari terakhir</b><br>'+rows,
 [{t:'Kembali',fn:back()},
  {t:'Kebijakan Bank Sentral: '+s.n,fn:policy},
  {t:'Deposito Berjangka (bebas pajak)',fn:depoAmt},
  {t:'Pinjaman Usaha',fn:loanScr},
  {t:'Donasi Komunitas (reputasi + kredit pajak)',fn:donate},
  {t:'Kontrak Harga PBF',fn:lockScr},
  {t:'Klaim Hadiah Stabilitas'+(rew>0&&e.streak>=P.streakN?' — '+rp(rew):''),d:e.streak<P.streakN||rew<=0,fn:claim},
  {t:'Aturan penstabil',fn:rules}])}
/* ---------- kebijakan ---------- */
function policy(){var e=E(),cd=e.stDay+P.stCd-day(),k=Object.keys(ST);
 modal('Kebijakan Bank Sentral','Pilih pengaturan ekonomi apotekmu. Bisa diganti tiap '+P.stCd+' hari'+(cd>0?' (jeda tersisa '+cd+' hari)':'')+'.<br>'+k.map(function(x){var v=ST[x];return'<b>'+v.n+'</b>'+(e.st===x?' (aktif)':'')+': pajak ×'+v.tax+', harga PBF dibatasi '+Math.round(v.lo*100)+'% s/d +'+Math.round(v.hi*100)+'%, subsidi ×'+v.sub+', bunga deposito ×'+v.int+'.<br><small>'+v.d+'</small>'}).join('<br>'),
 [{t:'Kembali',fn:panel}].concat(k.map(function(x){return{t:'Pakai '+ST[x].n,d:e.st===x||cd>0,fn:function(){e.st=x;e.stDay=day();done('Kebijakan: '+ST[x].n);panel()}}})))}
/* ---------- deposito ---------- */
function depoAmt(){var e=E(),T=target(),cap=P.depCapX*tb(),room=Math.max(0,cap-depTotal()),ex=Math.max(0,Math.floor((S.money-T)/1000)*1000);
 var list=e.dep.map(function(x,i){return{t:'Tarik awal Rp'+Math.round(x.p).toLocaleString('id-ID')+' (jatuh tempo H'+x.due+') — denda '+Math.round(P.depPenalty*100)+'%',fn:function(){var pen=Math.round(x.p*P.depPenalty);e.dep.splice(i,1);S.money+=x.p-pen;e.fund+=pen;done('Deposito ditarik, denda '+rp(pen));depoAmt()}}});
 var opts=[1000000,5000000,10000000].map(function(a){return{t:'Setor '+rp(a),d:S.money<a||a>room,fn:function(){depoTen(a)}}});
 opts.push({t:'Setor semua kelebihan kas di atas target ('+rp(Math.min(ex,room))+')',d:Math.min(ex,room)<100000,fn:function(){depoTen(Math.min(ex,room))}});
 modal('Deposito Berjangka','Uang yang didepositokan dikunci sampai jatuh tempo dan <b>bebas pajak penumpukan</b>. Bunga dibayar dari Dana Stabilisasi (bisa lebih kecil bila dana tipis). Tarik awal kena denda.<br>Tenor 7 hari: +'+(P.depRate[7]*100*st().int).toFixed(1)+'% • 14 hari: +'+(P.depRate[14]*100*st().int).toFixed(1)+'% • 30 hari: +'+(P.depRate[30]*100*st().int).toFixed(1)+'%<br>Total deposito: <b>'+rp(depTotal())+'</b> dari batas '+rp(cap),
 [{t:'Kembali',fn:panel}].concat(opts,list))}

 modal('Pilih tenor','Setor <b>'+rp(a)+'</b>. Pilih lama penyimpanan:',[{t:'Kembali',fn:depoAmt}].concat([7,14,30].map(function(t){var r=P.depRate[t]*s.int;return{t:t+' hari — bunga +'+(r*100).toFixed(1)+'% ('+rp(a*r)+')',d:S.money<a,fn:function(){S.money-=a;e.dep.push({p:a,r:r,due:day()+t});done('Deposito '+rp(a)+' selama '+t+' hari');depoAmt()}}})))}
/* ---------- pinjaman ---------- */
function loanLimit(){var e=E();return Math.floor(Math.min(e.fund*P.loanFundX,P.loanCostX*cost())/10000)*10000}
function loanScr(){var e=E(),L=e.loan,lim=loanLimit();
 if(L){return modal('Pinjaman Usaha','Sisa pinjaman: <b>'+rp(L.left)+'</b><br>Cicilan harian: '+rp(L.inst)+(L.late?'<br><span style="color:#d9534f">Telat bayar '+L.late+' kali. Denda '+Math.round(P.loanLate*100)+'% dan reputasi −1 tiap telat.</span>':''),
  [{t:'Kembali',fn:panel},{t:'Lunasi sekarang ('+rp(L.left)+')',d:S.money<L.left,fn:function(){S.money-=L.left;e.fund+=L.left;e.loan=null;done('Pinjaman lunas');loanScr()}}])}
 var opts=[.25,.5,1].map(function(f){var a=Math.floor(lim*f/10000)*10000;return{t:'Pinjam '+rp(a)+' — kembali '+rp(Math.round(a*(1+P.loanRate)))+' / '+P.loanTenor+' hari',d:a<100000||(S.rep||0)<P.loanRep,fn:function(){var t=Math.round(a*(1+P.loanRate));e.fund-=a;S.money+=a;e.loan={p:a,left:t,inst:Math.ceil(t/P.loanTenor),late:0};done('Pinjaman cair '+rp(a));loanScr()}}});
 modal('Pinjaman Usaha','Modal darurat dari Dana Stabilisasi. Bunga flat '+Math.round(P.loanRate*100)+'%, cicilan otomatis tiap pergantian hari selama '+P.loanTenor+' hari. Butuh reputasi minimal '+P.loanRep+' (milikmu '+Math.round(S.rep||0)+').<br>Plafon saat ini: <b>'+rp(lim)+'</b> (maks 50% dana dan '+P.loanCostX+'× biaya harian).'+(lim<100000?'<br><i>Dana Stabilisasi belum cukup. Pajak dan iuran akan mengisinya.</i>':''),
 [{t:'Kembali',fn:panel}].concat(opts))}
/* ---------- donasi ---------- */

 modal('Donasi Komunitas','Dana masuk ke Dana Stabilisasi untuk membantu warga dan apotek lain. Kamu mendapat XP, reputasi (+1 tiap '+rp(P.donRepPer)+', maks +'+P.donRepMax+' per hari) dan <b>kredit pajak '+Math.round(P.donCredit*100)+'%</b> dari nilai donasi.<br>Kredit pajak sekarang: <b>'+rp(e.cr)+'</b> • Total donasi: '+rp(e.don),
 [{t:'Kembali',fn:panel}].concat([100000,500000,2000000].map(function(a){return{t:'Donasi '+rp(a),d:S.money<a,fn:function(){var r=e.rd,add=Math.min(Math.floor(a/P.donRepPer),P.donRepMax-r.n);if(add<0)add=0;
  S.money-=a;e.fund+=a;e.cr+=Math.round(a*P.donCredit);e.don+=a;r.n+=add;S.rep=Math.min(100,(S.rep||0)+add);

 [{t:'Kembali',fn:panel},{t:'Beli kontrak '+rp(fee),d:act||S.money<fee,fn:function(){S.money-=fee;e.fund+=fee;e.lock=day()+P.lockDays-1;done('Harga PBF dikunci '+P.lockDays+' hari');lockScr()}}])}

function claim(){var e=E(),r=Math.min(Math.floor(e.fund*P.streakFund),Math.round(P.streakRewX*cost()));if(e.streak<P.streakN||r<=0)return panel();

function rules(){

var tag=ps[0]?sent(ps[0].textContent.trim()):'',dev=ps[1]?ps[1].textContent.trim():'';

 +'<div class="st-w b">'+person('#f1c9a0','#3b2417','#6c8997','#3a3556',true)+'</div>';

<script id="hx-paper-js">
(function(){
if(window.__HXP)return;window.__HXP=1;
var $=function(i){return document.getElementById(i)};
function widget(){
  var clk=$('clk');if(!clk)return null;
  var w=$('lx-qb');
  if(!w){
    w=document.createElement('div');w.id='lx-qb';w.hidden=true;
    w.innerHTML='<div class="r"><span>\uD83D\uDD14 <b class="n">-</b></span><span>Antre <b class="q">0</b></span></div><div class="hq-bar"><i></i><b>\uD83E\uDDF9 Kebersihan 100%</b></div>';
    clk.insertAdjacentElement('afterend',w);
  }
  return w;
}
function upd(){
  var q=$('qb'),w=widget();if(!w||!q)return;
  var m=/\uD83D\uDD14\s*(\S+)\s*\u2022\s*antre\s*(\d+)\s*\u2022\s*\uD83E\uDDF9\s*(\d+)%/i.exec(q.textContent||'');
  if(!m)return;
  w.hidden=false;
  w.querySelector('.n').textContent=m[1];
  w.querySelector('.q').textContent=m[2];
  var c=Math.max(0,Math.min(100,+m[3]));
  w.querySelector('.hq-bar i').style.width=c+'%';
  w.querySelector('.hq-bar b').textContent='\uD83E\uDDF9 Kebersihan '+c+'%';
  w.classList.toggle('low',c<40);
  w.classList.toggle('mid',c>=40&&c<70);
}
function scan(){
  var q=$('qb');
  if(q&&!q._hx){q._hx=1;new MutationObserver(upd).observe(q,{childList:true,characterData:true,subtree:true});upd()}
  var c=$('clk');
  if(c&&!c._hx){c._hx=1;
    var f=function(){var o=/BUKA/.test(c.textContent||'')?'1':'0';if(c.dataset.open!==o)c.dataset.open=o};
    new MutationObserver(f).observe(c,{childList:true,characterData:true,subtree:true});f();
  }
}
new MutationObserver(scan).observe(document.body,{childList:true,subtree:true});
scan();
})();
</script>

<script id="lx-long-js">
(function(){
if(window.__LXZ)return;window.__LXZ=1;
var R=function(a,b){return a+Math.random()*(b-a)};
var TIER={silver:'Pengumuman',gold:'Maklumat Emas',royal:'Dekrit Kerajaan',mythic:'Siaran Mythic'};

function confetti(from){
  var r=from.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,
      cols=['#ffd36a','#fff1b8','#7fffd4','#ff8ab3','#8ec5ff'],em=['\uD83E\uDE99','\u2728','\uD83D\uDCB0'];
  var fr=document.createDocumentFragment();
  for(var i=0;i<28;i++){
    var p=document.createElement('span'),a=R(-Math.PI*0.95,-Math.PI*0.05),d=R(80,230);
    p.className='lxz-conf'+(i%3?' r':'');
    if(i%3)p.style.background=cols[i%cols.length];else p.textContent=em[i%em.length];
    p.style.cssText+=';left:'+x+'px;top:'+y+'px;--dx:'+Math.round(Math.cos(a)*d)+'px;--dy:'+Math.round(Math.sin(a)*d+R(60,150))+'px;--rot:'+Math.round(R(-540,540))+'deg;--t:'+R(1,1.7).toFixed(2)+'s';
    fr.appendChild(p);
    (function(n){setTimeout(function(){n.remove()},1900)})(p);
  }
  document.body.appendChild(fr);
}

/* teks isi 1 baris; kalau lebih panjang dari kolom -> berjalan pelan (transform saja, mulus) */
function fit(ov){
  try{
    var b=ov.querySelector('.lx-b');if(!b)return;
    var s=b.firstChild;if(!s||s.className!=='lx-bi')return;
    b.classList.remove('mq');
    var over=s.offsetWidth-b.clientWidth;
    if(over>2){
      var d=over+28;
      b.style.setProperty('--mqd',(-d)+'px');
      b.style.setProperty('--mqt',Math.max(5,d/30).toFixed(1)+'s');
      b.classList.add('mq');
    }
  }catch(e){}
}
window.addEventListener('resize',function(){var o=document.getElementById('lx-ov');if(o)fit(o)});

function lux(ov){
  if(ov._lz)return;ov._lz=1;
  var tr=ov.getAttribute('data-tr')||'gold',fr=ov.querySelector('.lx-fr'),inn=ov.querySelector('.lx-in'),k=ov.querySelector('.lx-k');
  if(fr){
    var gd=document.createElement('i');gd.className='lx-gd';fr.insertBefore(gd,fr.firstChild);
    var f=document.createElement('div');f.className='lxz-flash';fr.appendChild(f);
  }
  if(k){
    var tx=(k.textContent||'').replace(/^\S+\s+/,'').replace(/[&<>]/g,'').trim();
    var c=document.createElement('div');c.className='lx-crest';
    c.innerHTML='<span><i>\u265B</i>'+tx+'<i>\u265B</i></span>';ov.appendChild(c);
  }
  var v=document.createElement('div');v.className='lxz-veil';v.setAttribute('data-tr',tr);
  document.body.appendChild(v);ov._veil=v;
  if(inn){
    /* aurora mythic */
    if(tr==='mythic'){var au=document.createElement('i');au.className='lx-au';inn.insertBefore(au,inn.firstChild)}
    /* isi 1 baris */
    var b=inn.querySelector('.lx-b');
    if(b){b.innerHTML='<span class="lx-bi">'+b.innerHTML.replace(/<br\s*\/?>/gi,' \u2022 ')+'</span>'}
    /* pill dibungkus, baris pill dipindah sejajar kolom */
    var t2=inn.querySelector('.lx-tx'),row=inn.querySelector('.lx-row');
    if(row){
      var ps=document.createElement('span');ps.className='lx-ps';
      [].slice.call(row.querySelectorAll('.lx-pl')).forEach(function(p){ps.appendChild(p)});
      if(ps.firstChild)row.insertBefore(ps,row.firstChild);
      if(t2)inn.insertBefore(row,t2.nextSibling);
    }
    /* partikel naik */
    var dh='',i;for(i=0;i<12;i++)dh+='<i class="lx-d" style="left:'+R(3,97).toFixed(1)+'%;--s:'+R(2,4.5).toFixed(1)+'px;--du:'+R(3,5.5).toFixed(1)+'s;--de:'+R(0,4).toFixed(1)+'s"></i>';
    inn.insertAdjacentHTML('beforeend',dh);
  }
  var h='',j;
  for(j=0;j<10;j++){
    var e=j%4,st='';
    if(e==0)st='left:'+R(4,94)+'%;top:'+R(-22,-4)+'px';
    else if(e==1)st='left:'+R(4,94)+'%;bottom:'+R(-22,-4)+'px';
    else if(e==2)st='left:'+R(-18,-4)+'px;top:'+R(0,80)+'%';
    else st='right:'+R(-18,-4)+'px;top:'+R(0,80)+'%';

  var s=document.createElement('div');s.className='lxz-spk';s.innerHTML=h;ov.appendChild(s);
  setTimeout(function(){[].forEach.call(s.querySelectorAll('i'),function(n){n.remove()})},1700);
  setTimeout(function(){fit(ov)},60);setTimeout(function(){fit(ov)},900);
  new MutationObserver(function(){
    var g=ov.querySelector('.lx-got');
    if(g&&!ov._cf){ov._cf=1;confetti(g)}
  }).observe(ov,{childList:true,subtree:true});
  if(tr!=='silver')setTimeout(function(){try{sfx('coin')}catch(e){}},600);
}
function gone(ov){var v=ov._veil;if(!v)return;v.classList.add('off');setTimeout(function(){v.remove()},400)}

new MutationObserver(function(ms){
  ms.forEach(function(m){
    [].forEach.call(m.addedNodes,function(n){if(n.id==='lx-ov')lux(n)});
    [].forEach.call(m.removedNodes,function(n){if(n.id==='lx-ov')gone(n)});
  });
}).observe(document.body,{childList:true});
var ex=document.getElementById('lx-ov');if(ex)lux(ex);

/* chip berdenyut merah saat sisa < 1 menit */
setInterval(function(){
  [].forEach.call(document.querySelectorAll('.lx-chip'),function(c){
    var e=c.querySelector('em');if(!e)return;

  var ov=document.createElement('div');ov.id='lx-ov';ov.setAttribute('data-tr',tr);

   +'<div class="lx-med">\uD83D\uDC51</div><div class="lx-tx"><div class="lx-k">\uD83D\uDC51 '+TIER[tr]+'</div><div class="lx-t">Akhir Pekan Cuan Besar</div>'
   +'<div class="lx-b">Semua pendapatan apotek berlipat ganda sampai event berakhir. Selamat melayani pasien!</div>'

/* Layar penuh + kunci landscape otomatis pada sentuhan pertama (browser mewajibkan gestur pemain, tidak bisa tanpa itu).
   Hanya perangkat layar sentuh. Jika pemain sengaja keluar layar penuh, game tidak memaksa lagi di kunjungan berikutnya. */
(function(){
var de=document.documentElement,done=false,was=false;
var LSg=function(k){try{return localStorage.getItem(k)}catch(e){return null}},LSs=function(k,v){try{localStorage.setItem(k,v)}catch(e){}};
var on=function(){return document.fullscreenElement||document.webkitFullscreenElement||null};
var lock=function(){try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(function(){})}catch(e){}};
['fullscreenchange','webkitfullscreenchange'].forEach(function(n){document.addEventListener(n,function(){if(on())was=true;else if(was){was=false;LSs('plNoAutoFS','1')}})});
if(!(window.matchMedia&&matchMedia('(pointer:coarse)').matches))return;
var evs=['pointerup','touchend','click','keydown'];
function go(e){
  if(done)return;
  if(e&&e.target&&e.target.closest&&e.target.closest('.fsb'))return;
  done=true;evs.forEach(function(n){document.removeEventListener(n,go,true)});
  if(LSg('plNoAutoFS')==='1')return;
  if(on()){lock();return}
  if(!(de.requestFullscreen||de.webkitRequestFullscreen))return;
  var p;try{p=de.requestFullscreen?de.requestFullscreen({navigationUI:'hide'}):de.webkitRequestFullscreen()}catch(x){return}
  Promise.resolve(p).then(lock).catch(function(){})}
evs.forEach(function(n){document.addEventListener(n,go,true)});
})();

<script id="mungil-fx">
/* ===== PATCH MUNGIL: karakter & NPC chibi pixel-art yang lebih kecil + efek realistis (Phaser 3) =====

   1. Semua tekstur karakter 32x48 (pemain, NPC, pegawai, pemain online, peran xr_) dibentuk ulang SEKALI saat pertama dipakai:
      kepala besar, badan kecil, outline berwarna (sel-out), bayangan & highlight arah cahaya kiri-atas, kilau rambut.

      debu pijakan saat lari, label nama diturunkan agar pas di atas kepala mungil.

  for(y=0;y<H;y++)for(x=0;x<W;x++){i=y*W+x;if(!mk[i]||isEye(i))continue;
    var up=!on(mk,x,y-1),lf=!on(mk,x-1,y),dn=!on(mk,x,y+1),rt=!on(mk,x+1,y),k=0;

    if(y>=H-3&&!dn)k-=9;                                     /* sepatu lebih gelap di tanah */
    var yy=y-DY0;if(yy>=1&&yy<=2&&x>=11&&x<=17&&lum(base[i*4],base[i*4+1],base[i*4+2])<105)k+=26;   /* kilau rambut */

        var vk=(lift||blink)?variant(sc,bt,baseKey,lift,blink)||(lift?variant(sc,bt,baseKey,lift,false):null):null;

      var sc_=sp.scaleX||1,len=1+(1-sn)*1.1,wd=(day?12+8*(1-sn):13)*sc_,al=day?(.2+.16*sn):.14;
      if(mv)wd*=1+.07*Math.sin(time/(sp.body&&sp.body.speed>150?55:85));
      sh.setPosition(sp.x+(day?-cs*7*sc_:0),sp.y-1).setScale(wd/16*(day?len*.9:1),sc_).setDepth(sp.depth-.5).setAlpha(al*(sp.alpha===undefined?1:sp.alpha)).setVisible(sp.visible);

    });

    try{if(sc.pts)sc.pts.forEach(function(p){if(p.tg&&p.tg.active&&p.sp&&p.sp.active)p.tg.y=p.sp.y-36});
      if(sc.ew)sc.ew.forEach(function(w){if(w.sh&&w.sh.visible)w.sh.setVisible(false);if(w.tag&&w.tag.active&&w.s&&w.s.active)w.tag.y=w.s.y-33});

<script id="dunia-fx">
/* ===== PATCH DUNIA: suasana pixel realistis (Phaser 3) =====
